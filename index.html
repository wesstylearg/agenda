<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Agenda Semanal - Aplicación académica personal, modular y offline">
  <title>Agenda Semanal</title>

  <!-- Web App Manifest & PWA Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <!-- Main Content View Screens -->
    <main id="main-container">
      <!-- Screen 1: Inicio -->
      <section id="view-home" class="view-screen" role="tabpanel" aria-labelledby="nav-btn-home" aria-hidden="false"></section>

      <!-- Screen 2: Calendario -->
      <section id="view-calendar" class="view-screen" role="tabpanel" aria-labelledby="nav-btn-calendar" aria-hidden="true"></section>

      <!-- Screen 3: Más -->
      <section id="view-more" class="view-screen" role="tabpanel" aria-labelledby="nav-btn-more" aria-hidden="true"></section>
    </main>

    <!-- Fixed Bottom Navigation Bar (3 items) -->
    <nav id="bottom-nav" class="bottom-nav" role="tablist" aria-label="Navegación principal">
      <!-- Tab 1: Inicio -->
      <button type="button" class="nav-item active" id="nav-btn-home" role="tab" aria-selected="true" aria-controls="view-home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-label">Inicio</span>
      </button>

      <!-- Tab 2: Calendario -->
      <button type="button" class="nav-item" id="nav-btn-calendar" role="tab" aria-selected="false" aria-controls="view-calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="nav-label">Calendario</span>
      </button>

      <!-- Tab 3: Más -->
      <button type="button" class="nav-item" id="nav-btn-more" role="tab" aria-selected="false" aria-controls="view-more">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"></circle>
          <circle cx="19" cy="12" r="1.5"></circle>
          <circle cx="5" cy="12" r="1.5"></circle>
        </svg>
        <span class="nav-label">Más</span>
      </button>
    </nav>

    <!-- Modal & Bottom Sheet Overlay Mount Point -->
    <div id="modal-container"></div>

    <!-- Toast Notification Mount Point -->
    <div id="toast-container" aria-live="polite"></div>
  </div>

  <!-- Main JavaScript Bootstrap Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
